[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-rag"
version = "0.1.0"
description = "Citation-bearing local RAG over a 20k+ trusted-nonfiction ebook library."
readme = "README.md"
requires-python = ">=3.8"
# Phase 1 (inventory) is intentionally standard-library only so it runs on the
# current Zorin box with zero installs. Later phases add optional extras.
dependencies = []

[project.optional-dependencies]
# Phase 6 / local RAG stack — installed after the Arch + RTX 4080 migration.
rag = []
dev = ["pytest>=7"]

[project.scripts]
knowledge-rag-inventory = "pipelines.phase1_inventory.inventory:main"

[tool.setuptools.packages.find]
include = ["pipelines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
